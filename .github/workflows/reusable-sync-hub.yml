name: Reusable Research Hub Synchronization

on:
  workflow_call:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hub repository
        uses: actions/checkout@v4

      - name: Check out research registry
        uses: actions/checkout@v4
        with:
          repository: LystadJS/research-registry
          path: .registry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .registry/requirements.txt

      - name: Install registry dependencies
        run: pip install -r .registry/requirements.txt

      - name: Discover current public projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .registry/scripts/discover_projects.py --owner LystadJS --output-dir /tmp/jsl-projects

      - name: Validate discovered project manifests
        run: python .registry/scripts/validate_manifest.py --type project --manifest-dir /tmp/jsl-projects

      - name: Validate hub manifest
        shell: bash
        run: |
          if [[ -f .research/method.yml ]]; then
            python .registry/scripts/validate_manifest.py --type method --file .research/method.yml --repository-name "$GITHUB_REPOSITORY"
          elif [[ -f .research/domain.yml ]]; then
            python .registry/scripts/validate_manifest.py --type domain --file .research/domain.yml --repository-name "$GITHUB_REPOSITORY"
          else
            echo "No hub manifest found" >&2
            exit 1
          fi

      - name: Synchronize generated README indexes
        run: python .registry/scripts/sync_hub_readme.py --hub-root . --manifest-dir /tmp/jsl-projects

      - name: Commit synchronized README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Hub README already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Synchronize research hub project index"
          git push
