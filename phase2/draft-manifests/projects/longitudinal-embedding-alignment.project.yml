schema_version: "1.0"
project:
  id: longitudinal-embedding-alignment
  title: "Longitudinal Embedding Alignment and Relative Movement"
  short_title: "Longitudinal Embedding Alignment"
  repository: "LystadJS/draftmapR"
  type: software
  status: active
  featured: true
  summary: "R package development for aligning repeated low-dimensional coordinate maps, tracking reference-relative movement, handling changing entity sets, and diagnosing correspondence across repeated embeddings."
methods:
  - id: dimension-reduction
    role: primary
    techniques: [pca, multidimensional-scaling, procrustes-alignment]
    usage: "Supports PCA and classical multidimensional-scaling embeddings and aligns repeated maps with orthogonal Procrustes transformations."
  - id: longitudinal-multilevel
    role: secondary
    techniques: [longitudinal-analysis]
    usage: "Treats repeated coordinate maps as longitudinal representations and measures entity movement across repeated observations."
  - id: statistical-computing
    role: secondary
    techniques: [data-visualization, reproducible-computing]
    usage: "Implements transformation diagnostics, reusable R functions, tests, documentation, and descriptive trajectory visualization."
